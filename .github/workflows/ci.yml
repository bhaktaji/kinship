name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow only reads the repository and uploads artifacts.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify (unit + Testcontainers integration)
        working-directory: api
        run: mvn -B -ntp verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            api/target/surefire-reports
            api/target/failsafe-reports
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Typecheck
        working-directory: web
        run: npm run typecheck
      - name: Build
        working-directory: web
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 25
    env:
      KINSHIP_JWT_SECRET: ci-e2e-secret-value-at-least-32-characters
      KINSHIP_SEED: "true"
      KINSHIP_CORS_ORIGINS: http://localhost:3000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      # Builds the API and standalone Next.js images, applies Flyway and seeds the
      # demo city. `--wait` blocks on the healthchecks defined in docker-compose.
      - name: Start the stack (PostGIS + Redis + API + web)
        run: docker compose -f infra/docker-compose.yml up -d --build --wait

      - name: Wait for API readiness (DB + Redis)
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8080/readyz >/dev/null; then
              echo "API ready after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become ready"
          docker compose -f infra/docker-compose.yml logs --tail=200 api
          exit 1

      - name: Wait for web and PWA assets
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3000/ >/dev/null \
              && curl -fsS http://localhost:3000/manifest.webmanifest >/dev/null \
              && curl -fsS http://localhost:3000/sw.js >/dev/null; then
              echo "Web ready after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "Web did not serve the app and PWA assets"
          docker compose -f infra/docker-compose.yml logs --tail=200 web
          exit 1

      - name: Playwright critical journeys
        working-directory: web
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_API_BASE_URL: http://localhost:8080
          # The compose stack serves the production build; never spawn a second server.
          E2E_NO_SERVER: "1"
          CI: "true"
        run: npx playwright test

      - name: Upload Playwright traces, screenshots and report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            web/test-results
            web/playwright-report
          if-no-files-found: ignore

      - name: Stack logs
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --tail=200

      - name: Stop the stack
        if: always()
        run: docker compose -f infra/docker-compose.yml down --remove-orphans
