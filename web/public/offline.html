<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1c1917" />
    <title>Kinship — offline</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f6f2e8;
        color: #1c1917;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main {
        max-width: 28rem;
        border: 1px solid rgba(28, 25, 23, 0.1);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.85);
        padding: 28px;
        text-align: center;
      }
      h1 { font-size: 1.25rem; margin: 0 0 8px; }
      p { margin: 0; font-size: 0.9rem; line-height: 1.6; color: rgba(28, 25, 23, 0.65); }
      a {
        display: inline-block;
        margin-top: 20px;
        min-height: 44px;
        padding: 12px 22px;
        border-radius: 999px;
        background: #1c1917;
        color: #f6f2e8;
        font-size: 0.875rem;
        text-decoration: none;
      }
      a:focus-visible { outline: 3px solid #b45309; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>
        Kinship needs a connection for messages and RSVPs. Activities you viewed
        recently may still be available from the home screen.
      </p>
      <a href="/">Try the home screen</a>
    </main>
  </body>
</html>
